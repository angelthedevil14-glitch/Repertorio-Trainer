let nodes=[],cur=null,B={},sel=null,flipped=false,locked=false,lastA=null,lastB=null,good=0,bad=0,streak=0;const $=x=>document.getElementById(x);
function initial(){const b={};for(let i=0;i<8;i++){b[F[i]+"2"]="P";b[F[i]+"7"]="p"}Object.assign(b,{a1:"R",b1:"N",c1:"B",d1:"Q",e1:"K",f1:"B",g1:"N",h1:"R",a8:"r",b8:"n",c8:"b",d8:"q",e8:"k",f8:"b",g8:"n",h8:"r"});return b}
function mv(b,m){const a=m.slice(0,2),z=m.slice(2,4),promo=m[4],pc=b[a];if(!pc)return;delete b[a];if((pc==="P"||pc==="p")&&a[0]!==z[0]&&!b[z]){const rr=pc==="P"?Number(z[1])-1:Number(z[1])+1;delete b[z[0]+rr]}b[z]=promo?(pc===pc.toUpperCase()?promo.toUpperCase():promo.toLowerCase()):pc;if(pc==="K"&&a==="e1"&&z==="g1"){delete b.h1;b.f1="R"}if(pc==="K"&&a==="e1"&&z==="c1"){delete b.a1;b.d1="R"}if(pc==="k"&&a==="e8"&&z==="g8"){delete b.h8;b.f8="r"}if(pc==="k"&&a==="e8"&&z==="c8"){delete b.a8;b.d8="r"}}
function position(m,n){const b=initial();for(let i=0;i<n;i++)mv(b,m[i]);return b}function pref(a,b,n){for(let i=0;i<n;i++)if(a[i]!==b[i])return false;return true}
function build(){nodes=[];for(const l of L)for(let p=0;p<l.m.length;p+=2)nodes.push({g:l.g,n:l.n,t:l.t,m:l.m,p,expect:l.m[p]});const gs=[...new Set(L.map(x=>x.g))].sort();$("filter").innerHTML='<option value="all">Tutto il repertorio</option>'+gs.map(g=>`<option value="${g}">${g}</option>`).join("")}
function dok(n){const d=$("depthFilter").value;if(d==="all")return true;if(d==="early")return n.p<=10;if(d==="mid")return n.p>10&&n.p<=18;return n.p>18}
function next(){let pool=nodes.filter(n=>($("filter").value==="all"||n.g===$("filter").value)&&dok(n));if(!pool.length)pool=nodes;cur=pool[Math.floor(Math.random()*pool.length)];B=position(cur.m,cur.p);sel=null;locked=false;lastA=lastB=null;$("opening").textContent=cur.g;$("line").textContent=cur.n;$("depth").textContent="Ply "+cur.p;$("note").textContent=cur.t||"";stat("");render()}
function order(){return flipped?{fs:[...F].reverse(),rs:[1,2,3,4,5,6,7,8]}:{fs:[...F],rs:[8,7,6,5,4,3,2,1]}}
function render(){const {fs,rs}=order();$("ranks").innerHTML=rs.map(x=>`<span>${x}</span>`).join("");$("files").innerHTML=fs.map(x=>`<span>${x}</span>`).join("");$("board").innerHTML="";for(const r of rs)for(const f of fs){const s=f+r,fi=F.indexOf(f),e=document.createElement("button");e.className="sq "+(((fi+r)%2)?"dark":"light");if(sel===s)e.classList.add("sel");if(s===lastA||s===lastB)e.classList.add("last");const pc=B[s];if(pc){const p=document.createElement("span");p.className="piece "+(pc===pc.toUpperCase()?"wp":"bp");p.textContent=S[pc];e.appendChild(p)}e.onclick=()=>tap(s,pc);$("board").appendChild(e)}}
function stat(t,k=""){$("status").textContent=t;$("status").className="status "+k}function scores(){$("good").textContent=good;$("bad").textContent=bad;$("streak").textContent=streak}
function tap(s,pc){if(locked||!cur)return;const white=pc&&pc===pc.toUpperCase();if(!sel){if(white){sel=s;render()}return}if(s===sel){sel=null;render();return}if(white){sel=s;render();return}attempt(sel,s)}
function attempt(a,b){if(a+b===cur.expect.slice(0,4)){good++;streak++;scores();locked=true;sel=null;lastA=a;lastB=b;mv(B,cur.expect);render();stat("Corretta ✓","ok");setTimeout(reply,420)}else{bad++;streak=0;scores();sel=null;render();stat("Mossa errata.","bad")}}
function reply(){const bp=cur.p+1;if(bp>=cur.m.length){stat("Ramo completato. Nuova posizione…","ok");return setTimeout(next,700)}const black=cur.m[bp];mv(B,black);lastA=black.slice(0,2);lastB=black.slice(2,4);render();stat("Il Nero ha mosso. Tocca a te.","info");const wp=bp+1;if(wp>=cur.m.length){locked=true;return setTimeout(next,850)}const cs=L.filter(l=>l.g===cur.g&&l.m.length>wp&&pref(l.m,cur.m,wp));const line=cs.length?cs[Math.floor(Math.random()*cs.length)]:null;if(!line){locked=true;return setTimeout(next,850)}cur={g:line.g,n:line.n,t:line.t,m:line.m,p:wp,expect:line.m[wp]};locked=false;$("line").textContent=cur.n;$("depth").textContent="Ply "+cur.p;$("note").textContent=cur.t||""}
$("newBtn").onclick=next;$("flipBtn").onclick=()=>{flipped=!flipped;sel=null;render()};$("filter").onchange=next;$("depthFilter").onchange=next;build();next();
</script></body></html>
